name: CI

on:
  push:
    branches: [master, dev01]
  pull_request:
    branches: [master]

jobs:
  backend-test:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 应用自检(配置/路由/依赖)
        env:
          ADMIN_SECRET_KEY: ci-test-secret-key-for-github-actions-0123456789
          USER_SECRET_KEY: ci-test-secret-key-for-github-actions-0123456789
        run: python scripts/selfcheck.py

      - name: 运行单元测试
        env:
          # 测试用固定密钥(conftest 使用 SQLite 内存库,无需 MySQL/Redis)
          ADMIN_SECRET_KEY: ci-test-secret-key-for-github-actions-0123456789
          USER_SECRET_KEY: ci-test-secret-key-for-github-actions-0123456789
        run: pytest -v --tb=short

  frontend-build:
    name: 前端构建 (admin + user)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend-admin, frontend-user]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: ${{ matrix.app }}/dist
          retention-days: 7

  docker-build:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -t sky-backend:ci ./backend

      - name: 镜像内自检(配置加载 + 路由完整性 + 依赖)
        run: |
          docker run --rm \
            -e ADMIN_SECRET_KEY=ci-test-secret-key-for-github-actions-0123456789 \
            -e USER_SECRET_KEY=ci-test-secret-key-for-github-actions-0123456789 \
            sky-backend:ci python scripts/selfcheck.py
