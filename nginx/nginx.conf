# 网关:容器内 80=用户端H5, 81=管理端
#       对外端口由 docker-compose 映射(默认 8080/8081,避免大陆云服务器 80 端口备案限制)
# 注意:前端 API 请求路径为 /admin、/user、/static、/ws(无 /api 前缀),
#       正则 location 匹配这些路径 → 反代后端;其余 → 前端静态资源
#       管理端单独 81 端口,避免页面/静态与后端 /admin API 路径冲突

upstream backend {
    server backend:8000;
}

# ===== 用户端 H5(80)=====
server {
    listen 80;
    root /usr/share/nginx/html/user;

    # 后端 API(admin/user 接口 + 本地上传静态文件)
    location ~ ^/(admin|user|static)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket(订单/聊天/店铺推送)
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 前端路由(history 模式,找不到静态文件回 index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ===== 管理端(81)=====
server {
    listen 81;
    root /usr/share/nginx/html/admin;

    location ~ ^/(admin|user|static)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
