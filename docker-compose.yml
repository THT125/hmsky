# 一键部署
# 启动: docker compose up -d --build
# 访问: 用户端 http://<IP>:8080   管理端 http://<IP>:8081
#       (非标准端口,避免大陆云服务器 80 端口的备案限制;本地同样适用)
# 配置: 同目录建 .env 覆盖密钥与端口(下面带 :- 的均为可覆盖项)
#
# .env 示例:
#   USER_PORT=8080
#   ADMIN_PORT=8081
#   DB_PASSWORD=强密码
#   REDIS_PASSWORD=强密码
#   ADMIN_SECRET_KEY=<64位随机>
#   USER_SECRET_KEY=<64位随机>
#   UVICORN_WORKERS=2

services:
  mysql:
    image: mysql:8.0
    container_name: sky-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: sky-take-out-master-cg
      TZ: Asia/Shanghai
    # max-connections:MySQL 默认 151,而后端总连接数 = UVICORN_WORKERS × (DB_POOL_SIZE + DB_MAX_OVERFLOW),
    # 2×60=120 已逼近默认上限(4 workers 时是 240,会直接超限报 Too many connections)。
    # 放宽到 200 留余量;连接按需分配不预占内存,调大不额外吃资源。
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=200
    volumes:
      - mysql_data:/var/lib/mysql          # 数据持久化
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # 首次启动自动建库+种子
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sky-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-123456}
    volumes:
      - redis_data:/data                   # AOF 持久化
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: sky-backend
    environment:
      # 服务
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      # 进程数:建议 = CPU 核数。2核实例务必设 2 ——
      # 每个 worker 有独立连接池,总连接数 = UVICORN_WORKERS × (DB_POOL_SIZE + DB_MAX_OVERFLOW),
      # 设大了不仅抢 CPU,还会撑破 MySQL 的 max_connections(见 mysql 的 command 注释)
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # 数据库连接池(每个 worker 一份)。20+40 是压测后调高的值(见 docs/performance.md),
      # 调小会让抢券热路径重新出现连接排队,非必要别动
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      # 数据库(指向 compose 内的 mysql)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: sky-take-out-master-cg
      DB_ECHO: "0"
      # Redis(指向 compose 内的 redis)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      # JWT(生产必须替换为强随机密钥: python -c "import secrets; print(secrets.token_hex(32))")
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-change_me_in_production}
      USER_SECRET_KEY: ${USER_SECRET_KEY:-change_me_in_production}
      # 安全
      CAPTCHA_ENABLED: "1"
      LOGIN_FAIL_MAX: "5"
      LOGIN_FAIL_LOCK_MINUTES: "10"
      # 日志告警(飞书群机器人):URL 为空则关闭,不影响业务。
      # ⚠️ compose 的 environment 是显式白名单 —— 值写在根目录 .env,但必须在这里声明,
      #    否则容器里读不到(与 UVICORN_WORKERS 同理)
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_KEYWORD: ${ALERT_KEYWORD:-}
    volumes:
      - ./backend/static:/app/static       # 本地上传文件持久化
    healthcheck:
      # 探测 /health(内部检查 MySQL;Redis 异常不算不健康)
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s                    # 首次启动需等 MySQL 就绪 + alembic 迁移
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: sky-nginx
    ports:
      - "${USER_PORT:-8080}:80"     # 用户端 H5
      - "${ADMIN_PORT:-8081}:81"    # 管理端
    depends_on:
      backend:
        condition: service_healthy   # 等后端就绪再放流量,避免启动期 502
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
